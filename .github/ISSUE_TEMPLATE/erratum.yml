name: Erratum
description: Something in a guide is wrong, unclear or out of date.
labels: [erratum]
body:
  - type: dropdown
    id: guide
    attributes:
      label: Guide
      options:
        - "1. Neural networks"
        - "2. Tokenization"
        - "3. Embeddings"
        - "4. Attention"
        - "5. The transformer"
        - "6. Next-token prediction"
        - "7. Pre-training"
        - "Other / several"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Section heading, or a short quote of the sentence.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong, and what it should say
      description: A source helps (paper, official docs), especially for factual claims.
    validations:
      required: true
