name: Notebooks reproduce the guides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One matrix entry per released guide, read from release.json.
  list:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.slugs.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: slugs
        run: echo "slugs=$(jq -c '[.parts[].guides[].slug]' release.json)" >> "$GITHUB_OUTPUT"

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install nbformat==5.11.1
      - name: Notebooks match the guide sources
        run: python tools/build_notebooks.py --check

  verify:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.list.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            code/requirements.txt
            tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Run the notebook and compare with the guide's outputs
        run: python tools/verify_notebooks.py ${{ matrix.slug }}
