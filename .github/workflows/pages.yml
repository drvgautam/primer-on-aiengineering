name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # Playwright 1.57 can't install Chromium on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # The PDF is served next to the site, linked from the home page.
      - run: node book/build-pdf.mjs --out out/primer-on-aiengineering.pdf
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # The lecture slides too, at out/slides/, linked from the guide pages and the README.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pygments==2.21.0
      - run: node tools/build-slides.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: mkdir -p out/slides && cp dist/slides/*.pdf out/slides/
      # The visual guides, at out/visuals/: the A3 PDF and the PNG for sharing.
      - run: node tools/build-visuals.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: mkdir -p out/visuals && cp dist/visuals/*.pdf out/visuals/ && cp dist/visuals/*.png out/visuals/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
