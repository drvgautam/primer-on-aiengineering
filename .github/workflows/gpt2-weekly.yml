name: GPT-2 cells (weekly)

# The guides show some GPT-2 small blocks without running them, because the weights are a
# 548 MB download. This job runs them once a week with the weights cached, so the running
# example stays true.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpt2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            code/requirements.txt
            tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/llm-guides
          key: gpt2-607a30d
      - name: Download GPT-2 small at the pinned revision (hash checked by the code)
        run: |
          f=~/.cache/llm-guides/gpt2-607a30d.bin
          if [ ! -f "$f" ]; then
            mkdir -p ~/.cache/llm-guides
            curl -fL -o "$f" https://huggingface.co/openai-community/gpt2/resolve/607a30d783dfa663caf39e06633721c8d4cfcd7e/pytorch_model.bin
          fi
      - run: python tools/verify_notebooks.py --gpt2
